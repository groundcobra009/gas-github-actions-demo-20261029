name: Deploy GAS with clasp

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'src/**'
      - '.clasp.json'
      - '.github/workflows/deploy-gas.yml'
  workflow_dispatch:

concurrency:
  group: deploy-gas
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1

      # ~/.clasprc.json（clasp login 後のファイル）をシークレットから復元する。
      # CLASPRC_JSON_BASE64: base64 エンコードした中身（`base64 -i ~/.clasprc.json` の出力）
      - name: Write ~/.clasprc.json
        env:
          CLASPRC_B64: ${{ secrets.CLASPRC_JSON_BASE64 }}
        run: |
          if [ -z "$CLASPRC_B64" ]; then
            echo "::error::シークレット CLASPRC_JSON_BASE64 が見つかりません"
            exit 1
          fi
          printf '%s' "$CLASPRC_B64" | tr -d ' \r\n' | base64 -d > ~/.clasprc.json \
            || { echo "::error::CLASPRC_JSON_BASE64 を base64 としてデコードできません"; exit 1; }
          chmod 600 ~/.clasprc.json
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME + '/.clasprc.json', 'utf8'))" \
            || { echo "::error::デコード結果が JSON として読めません（~/.clasprc.json を base64 したものか確認）"; exit 1; }

      - name: Stamp build info
        run: |
          cat > src/BuildInfo.js <<EOF
          // GitHub Actions がデプロイ時に上書きする。ローカルではこの値のまま。
          const BUILD_INFO = {
            commit: '${GITHUB_SHA::7}',
            deployedAt: '$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')',
          };
          EOF

      - name: clasp push
        run: clasp push --force

      # DEPLOYMENT_ID シークレットがあれば同じデプロイ（同じ Web アプリ URL）を更新、
      # なければ新しいデプロイを作る。
      - name: clasp deploy
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          DESC="GitHub Actions ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})"
          if [ -n "$DEPLOYMENT_ID" ]; then
            clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "$DESC"
          else
            clasp deploy --description "$DESC"
          fi
          clasp deployments
