name: Deploy GAS with clasp

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'src/**'
      - '.clasp.json'
      - '.github/workflows/deploy-gas.yml'
  workflow_dispatch:

concurrency:
  group: deploy-gas
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1

      # ~/.clasprc.json（clasp login 後のファイル）をシークレットから復元する。
      # CLASPRC_JSON_BASE64: base64 エンコードした中身（`base64 -i ~/.clasprc.json` の出力）
      - name: Write ~/.clasprc.json
        env:
          CLASPRC_B64: ${{ secrets.CLASPRC_JSON_BASE64 }}
        run: |
          if [ -z "$CLASPRC_B64" ]; then
            echo "::error::シークレット CLASPRC_JSON_BASE64 が見つかりません"
            exit 1
          fi
          # base64 / base64url / パディング欠け / 前後の引用符 / JSON そのまま、のどれでも受ける。
          # ログには形式だけ出し、中身は出さない。
          node <<'JS'
          const fs = require('fs');
          let s = process.env.CLASPRC_B64.trim().replace(/^['"]|['"]$/g, '').trim();
          let json, kind;
          if (s.startsWith('{')) {
            json = s; kind = 'JSON そのまま';
          } else {
            const b = s.replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/').replace(/=+$/, '');
            if (!/^[A-Za-z0-9+/]*$/.test(b)) {
              console.log('::error::CLASPRC_JSON_BASE64 に base64 で使わない文字が含まれています');
              process.exit(1);
            }
            json = Buffer.from(b + '='.repeat((4 - b.length % 4) % 4), 'base64').toString('utf8').replace(/^﻿/, '');
            kind = 'base64';
          }
          let parsed;
          try { parsed = JSON.parse(json); } catch (e) {
            console.log(`::error::CLASPRC_JSON_BASE64 を ${kind} として読みましたが JSON になりません（~/.clasprc.json の中身か、それを base64 したものを登録してください）`);
            process.exit(1);
          }
          const format = parsed.tokens ? 'clasp v3 形式' : parsed.token ? 'clasp v2 形式' : '不明な形式';
          console.log(`clasprc: ${kind} として読み込み（${format}）`);
          fs.writeFileSync(process.env.HOME + '/.clasprc.json', JSON.stringify(parsed), { mode: 0o600 });
          JS

      - name: Stamp build info
        run: |
          cat > src/BuildInfo.js <<EOF
          // GitHub Actions がデプロイ時に上書きする。ローカルではこの値のまま。
          const BUILD_INFO = {
            commit: '${GITHUB_SHA::7}',
            deployedAt: '$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')',
          };
          EOF

      - name: clasp push
        run: clasp push --force

      # DEPLOYMENT_ID シークレットがあれば同じデプロイ（同じ Web アプリ URL）を更新、
      # なければ新しいデプロイを作る。
      - name: clasp deploy
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          DESC="GitHub Actions ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})"
          if [ -n "$DEPLOYMENT_ID" ]; then
            clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "$DESC"
          else
            clasp deploy --description "$DESC"
          fi
          clasp deployments
